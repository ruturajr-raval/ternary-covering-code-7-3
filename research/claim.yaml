current_supported_claim:
  statement: >-
    For each word c in the explicit eight-word core C0, every set of at most
    four centers added to C0 without c leaves at least six ternary length-7
    words uncovered at radius 3. Equality is attained. Consequently, no
    radius-3 covering code of size at most 11 contains any of these eight
    seven-word subcores or an isometric copy.
